    :root {

    body {

      background:

      overflow-x: hidden;

    a:hover {
      color: var(--accent-strong);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .skip-link {
      position: absolute;
      left: 16px;
      top: -48px;
      z-index: 20;
      padding: 10px 14px;
      color: #fff;
      background: var(--accent-strong);
      border-radius: 6px;
    }

    .skip-link:focus {

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;

      background: rgba(247, 248, 245, 0.92);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      padding: 12px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 760;
      letter-spacing: 0;
      color: var(--ink);
      white-space: nowrap;
    }

    .mark {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(17, 108, 99, 0.3);
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 8px 20px rgba(17, 108, 99, 0.12);
    }

    .mark span {
      width: 20px;
      height: 12px;
      display: block;
      border-bottom: 3px solid var(--pulse);
      border-left: 3px solid transparent;
      border-radius: 50%;
      transform: rotate(-8deg);
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .top-nav::-webkit-scrollbar {
      display: none;
    }

    .top-nav a {
      flex: 0 0 auto;
      padding: 8px 10px;
      border-radius: 6px;
      color: #394844;
      font-size: 13px;
      font-weight: 650;
    }

    .top-nav a:hover {
      background: var(--surface-strong);
      text-decoration: none;
    }

    .hero {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 34px;
    }

      position: relative;
      overflow: hidden;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 82% 24%, rgba(200, 63, 79, 0.16), transparent 24%),
        linear-gradient(135deg, #ffffff 0%, #f1f6f2 58%, #f6efe6 100%);
      box-shadow: var(--shadow);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
      gap: 32px;
      min-height: 390px;
      padding: clamp(28px, 5vw, 58px);
      align-items: center;
    }

    .hero-grid > * {
      min-width: 0;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      padding: 6px 10px;
      width: fit-content;
      border: 1px solid rgba(17, 108, 99, 0.22);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 720;
    }

    h1 {
      margin: 0;
      max-width: 780px;
      font-size: clamp(38px, 7vw, 78px);
      line-height: 0.96;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .intro {
      max-width: 760px;
      margin: 22px 0 0;
      color: #465550;
      font-size: clamp(16px, 2.3vw, 20px);
      overflow-wrap: anywhere;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-weight: 720;
      box-shadow: 0 8px 20px rgba(24, 33, 31, 0.07);
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .button:hover {
      text-decoration: none;
      transform: translateY(-1px);
    }

    .signal-board {
      align-self: stretch;
      display: grid;
      align-content: center;
      gap: 18px;
      min-width: 0;
      min-height: 260px;
      padding: 24px;
      border: 1px solid rgba(17, 108, 99, 0.18);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.62);
    }

    .wave {
      width: 100%;
      min-width: 0;
      height: 122px;
      border-radius: 8px;
      border: 1px solid rgba(99, 113, 108, 0.2);
      background:
        linear-gradient(90deg, rgba(99, 113, 108, 0.13) 1px, transparent 1px),
        linear-gradient(0deg, rgba(99, 113, 108, 0.13) 1px, transparent 1px),
        #ffffff;
      background-size: 22px 22px;
      overflow: hidden;
    }

    .wave svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .metric {
      min-width: 0;
      padding: 12px;
      border: 1px solid rgba(220, 228, 223, 0.9);
      border-radius: 7px;
      background: #fff;
    }

    .metric strong {
      display: block;
      font-size: 24px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 28px;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto 64px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 78px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 10px 26px rgba(24, 33, 31, 0.06);
    }

    .sidebar-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .side-nav {
      display: grid;
      gap: 4px;
    }

    .side-nav a {
      display: block;
      padding: 8px 9px;
      border-radius: 6px;
      color: #35433f;
      font-size: 14px;
      font-weight: 650;
    }

    .side-nav a:hover {
      background: var(--surface-strong);
      text-decoration: none;
    }

    .content {
      display: grid;
      gap: 22px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 10px 26px rgba(24, 33, 31, 0.05);
    }

    .search {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 12px;
      color: var(--ink);
      background: #fff;
      font: inherit;
    }

    .search:focus {
      outline: 3px solid rgba(17, 108, 99, 0.18);
      border-color: var(--accent);
    }

    .count-pill {
      flex: 0 0 auto;
      padding: 10px 12px;
      border-radius: 7px;
      background: var(--surface-strong);
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 760;
    }

    .section {
      scroll-margin-top: 86px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 12px 32px rgba(24, 33, 31, 0.07);
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 22px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #f8faf8);
    }

    h2 {
      margin: 0;
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .section-count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 13px;
      font-weight: 720;
    }

    .table-wrap {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      background: #fff;
    }

    th,
    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f2f6f3;
      color: #43514d;
      font-size: 12px;
      font-weight: 820;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    td:first-child {
      width: 62%;
      font-weight: 620;
    }

    td:nth-child(2) {
      width: 20%;
      color: #4f5e59;
      white-space: nowrap;
    }

    td:nth-child(3) {
      width: 18%;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tr.is-hidden {
      display: none;
    }

    .empty-state {
      display: none;
      padding: 24px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .section.no-results .empty-state {
      display: block;
    }

    .ack {
      padding: 22px;
    }

    .ack ul {
      margin: 0;
      padding-left: 20px;
    }

    .site-footer {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto 38px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }
    }

    @media (max-width: 620px) {
      .hero {
        width: min(1180px, calc(100% - 20px));
        padding-top: 26px;
      }

      .hero-grid {
        padding: 22px;
      }

      .metrics {
        grid-template-columns: 1fr;
      }

      .layout,
      .site-footer,
      .topbar {
        width: min(1180px, calc(100% - 20px));
      }

      .signal-board {
        padding: 16px;
      }

      .wave {
        height: 104px;
      }

      .toolbar,
      .section-header {
        align-items: stretch;
        flex-direction: column;
      }

      .count-pill,
      .section-count {
        width: fit-content;
      }
    }
  </style>

  <script>
    const source = document.getElementById("readme-source").textContent
      .replaceAll("&gt;", ">")
      .replaceAll("&amp;", "&");

    const slug = (text) => text.toLowerCase().trim().replace(/[^\w\s-]/g, "").replace(/\s+/g, "-");
    const escapeHtml = (text) => text
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    function inlineMarkdown(text) {
      let html = escapeHtml(text.trim());
      html = html.replace(/\[(.*?)\]\((.*?)\)/g, (_, label, href) => {
        const cleanLabel = label.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
        return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${cleanLabel}</a>`;
      });
      html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
      return html;
    }

    function splitTableRow(line) {
      let normalized = line.trim();
      if (!normalized.startsWith("|")) normalized = `|${normalized}`;
      if (!normalized.endsWith("|")) normalized = `${normalized}|`;
      return normalized.slice(1, -1).split("|").map((cell) => cell.trim());
    }

    function parseReadme(markdown) {
      const lines = markdown.split(/\r?\n/);
      const sections = [];
      let title = "";
      let updated = "";
      let intro = "";
      let acknowledgments = [];
      let current = null;

      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i];
        const trimmed = line.trim();

        if (trimmed.startsWith("# ")) {
          title = trimmed.replace(/^#\s+/, "");
          continue;
        }

        if (trimmed.startsWith("> Last updated:")) {
          updated = trimmed.replace(/^>\s*/, "");
          continue;
        }

        if (!intro && trimmed && !trimmed.startsWith("-") && !trimmed.startsWith("#") && !trimmed.startsWith("|")) {
          intro = trimmed;
          continue;
        }

        if (trimmed.startsWith("### ")) {
          current = {
            title: trimmed.replace(/^###\s+/, ""),
            headers: [],
            rows: []
          };
          sections.push(current);
          continue;
        }

        if (trimmed === "## Acknowledgments") {
          current = null;
          while (i + 1 < lines.length) {
            i += 1;
            const ack = lines[i].trim();
            if (ack.startsWith("- ")) acknowledgments.push(ack.slice(2));
          }
          continue;
        }

        if (!current) continue;

        if (trimmed.includes("|") && !trimmed.startsWith("|:")) {
          const cells = splitTableRow(trimmed);
          if (cells.length >= 3 && cells.some(Boolean)) {
            if (/title/i.test(cells[0]) && /publication/i.test(cells[1])) {
              current.headers = cells.slice(0, 3);
            } else {
              current.rows.push(cells.slice(0, 3));
            }
          }
        }
      }

      return { title, updated, intro, sections, acknowledgments };
    }

    function renderSection(section) {
      const id = slug(section.title);
      const rows = section.rows.map((row) => `
        <tr data-search="${escapeHtml(row.join(" ").toLowerCase())}">
          ${row.map((cell) => `<td>${inlineMarkdown(cell || "-")}</td>`).join("")}
        </tr>
      `).join("");

      return `
        <section class="section" id="${id}" data-section="${escapeHtml(section.title)}">
          <div class="section-header">
            <h2>${escapeHtml(section.title)}</h2>
            <span class="section-count">${section.rows.length} entries</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>${section.headers.map((header) => `<th>${escapeHtml(header)}</th>`).join("")}</tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div class="empty-state">No matching entries in this section.</div>
        </section>
      `;
    }

    function renderAcknowledgments(items) {
      if (!items.length) return "";
      return `
        <section class="section" id="acknowledgments">
          <div class="section-header">
            <h2>Acknowledgments</h2>
          </div>
          <div class="ack">
            <ul>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</ul>
          </div>
        </section>
      `;
    }

    const data = parseReadme(source);
    const totalRows = data.sections.reduce((sum, section) => sum + section.rows.length, 0);
    const codeLinks = data.sections.reduce((sum, section) => {
      return sum + section.rows.filter((row) => /github|download/i.test(row[2] || "")).length;
    }, 0);

    document.title = data.title;
    document.getElementById("page-title").textContent = data.title;
    document.getElementById("updated-label").textContent = data.updated;
    document.getElementById("intro-text").textContent = data.intro;
    document.getElementById("paper-count").textContent = totalRows;
    document.getElementById("section-count").textContent = data.sections.length;
    document.getElementById("code-count").textContent = codeLinks;
    document.getElementById("visible-count").textContent = `${totalRows} shown`;
    document.getElementById("sections").innerHTML = data.sections.map(renderSection).join("") + renderAcknowledgments(data.acknowledgments);
    document.getElementById("side-nav").innerHTML = data.sections.map((section) => {
      return `<a href="#${slug(section.title)}">${escapeHtml(section.title)}</a>`;
    }).join("") + `<a href="#acknowledgments">Acknowledgments</a>`;

    const search = document.getElementById("search");
    const visibleCount = document.getElementById("visible-count");

    search.addEventListener("input", () => {
      const query = search.value.trim().toLowerCase();
      let visible = 0;

      document.querySelectorAll(".section[data-section]").forEach((section) => {
        let sectionVisible = 0;
        section.querySelectorAll("tbody tr").forEach((row) => {
          const match = !query || row.dataset.search.includes(query);
          row.classList.toggle("is-hidden", !match);
          if (match) {
            visible += 1;
            sectionVisible += 1;
          }
        });
        section.classList.toggle("no-results", sectionVisible === 0);
      });

      visibleCount.textContent = `${visible} shown`;
    });
  </script>
