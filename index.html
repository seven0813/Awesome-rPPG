<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awesome-rPPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;620;650;720;760;820&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --surface: #ffffff;
      --surface-strong: #eef3f0;
      --ink: #141b1a;
      --ink-soft: #2d3a37;
      --muted: #5d6d68;
      --muted-light: #8a9b95;
      --line: #dce4e0;
      --accent: #0d7a6e;
      --accent-soft: rgba(13, 122, 110, 0.10);
      --accent-strong: #08554c;
      --pulse: #d43f52;
      --pulse-soft: rgba(212, 63, 82, 0.12);
      --amber: #b87a1f;
      --code-bg: #e6f0ed;
      --shadow-sm: 0 4px 12px rgba(20, 27, 26, 0.07);
      --shadow-md: 0 10px 28px rgba(20, 27, 26, 0.08);
      --shadow-lg: 0 18px 50px rgba(20, 27, 26, 0.10);
      --radius: 10px;
      --radius-sm: 6px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101514;
        --bg-grid: #1a211f;
        --surface: #1c2321;
        --surface-strong: #26302d;
        --ink: #e3eae7;
        --ink-soft: #c2cdc9;
        --muted: #869994;
        --muted-light: #657a74;
        --line: #2d3a37;
        --line-light: #25302d;
        --accent: #1ab5a3;
        --accent-soft: rgba(26, 181, 163, 0.12);
        --accent-strong: #2cd4c0;
        --pulse: #f06072;
        --pulse-soft: rgba(240, 96, 114, 0.15);
        --code-bg: #1a2e29;
        --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.25);
        --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.30);
        --shadow-lg: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 86px;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px),
        linear-gradient(0deg, var(--bg-grid) 1px, transparent 1px),
        var(--bg);
      background-size: 40px 40px;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-strong); text-decoration: underline; text-underline-offset: 3px; }

    .skip-link {
      position: absolute; left: 16px; top: -48px; z-index: 20;
      padding: 10px 16px; color: #fff; background: var(--accent-strong);
      border-radius: var(--radius-sm); font-weight: 650;
    }
    .skip-link:focus { top: 16px; }

    .site-header {
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--line-light);
      background: rgba(244, 246, 248, 0.88);
      backdrop-filter: blur(16px) saturate(1.4);
    }
    @media (prefers-color-scheme: dark) {
      .site-header { background: rgba(16, 21, 20, 0.90); }
    }

    .topbar {
      display: flex; align-items: center; gap: 16px;
      width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 10px 0;
    }

    .brand {
      display: flex; align-items: center; gap: 10px;
      flex: 0 0 auto; font-weight: 760; font-size: 17px;
      color: var(--ink); white-space: nowrap; letter-spacing: -0.01em;
    }
    .top-nav {
      display: flex; align-items: center; gap: 2px;
      flex: 1; min-width: 0; overflow-x: auto;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .top-nav::-webkit-scrollbar { display: none; }
    .top-nav a {
      flex: 0 0 auto; padding: 7px 10px; border-radius: var(--radius-sm);
      color: var(--muted); font-size: 13px; font-weight: 650;
      transition: background .15s, color .15s;
    }
    .top-nav a:hover { background: var(--surface-strong); color: var(--ink); text-decoration: none; }
    .top-nav a.is-active {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .Github-button {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
      min-height: 32px; padding: 6px 12px;
      border: 1px solid var(--accent); border-radius: 8px;
      background: var(--accent); color: #fff;
      font-size: 12px; font-weight: 760; white-space: nowrap;
      box-shadow: 0 6px 16px rgba(13, 122, 110, 0.18);
      transition: background .15s, transform .15s;
    }
    .Github-button:hover { background: var(--accent-strong); color: #fff; text-decoration: none; transform: translateY(-1px); }

    .hero {
      width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 32px;
    }
    .hero-panel {
      position: relative; overflow: hidden; max-width: 100%;
      border: 1px solid var(--line); border-radius: var(--radius);
      background:
        radial-gradient(ellipse at 80% 20%, var(--pulse-soft) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 80%, var(--accent-soft) 0%, transparent 50%),
        linear-gradient(135deg, var(--surface) 0%, #f0f7f3 50%, #f7f0ea 100%);
      box-shadow: var(--shadow-lg);
    }
    @media (prefers-color-scheme: dark) {
      .hero-panel {
        background:
          radial-gradient(ellipse at 80% 20%, var(--pulse-soft) 0%, transparent 50%),
          radial-gradient(ellipse at 20% 80%, var(--accent-soft) 0%, transparent 50%),
          linear-gradient(135deg, var(--surface) 0%, #16231e 50%, #1e1917 100%);
      }
    }

    .hero-grid {
      display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(260px, 0.9fr);
      gap: 32px; min-height: 370px;
      padding: clamp(28px, 5vw, 56px); align-items: center;
    }
    .hero-grid > * { min-width: 0; }

    .kicker {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 0 0 16px; padding: 6px 12px; width: fit-content;
      border-radius: 999px;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(13, 122, 110, 0.2);
      color: var(--accent-strong); font-size: 13px; font-weight: 720;
    }

    h1 {
      margin: 0; max-width: 720px;
      font-size: clamp(36px, 6.5vw, 72px);
      line-height: 0.94; letter-spacing: -0.02em;
      overflow-wrap: anywhere; color: var(--ink);
    }

    .intro {
      max-width: 700px; margin: 20px 0 0;
      color: var(--muted); font-size: clamp(15px, 2vw, 18px);
      overflow-wrap: anywhere; line-height: 1.6;
    }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }

    .button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 10px 18px; border-radius: 9px;
      border: 1px solid var(--line); background: var(--surface);
      color: var(--ink); font-size: 14px; font-weight: 720;
      box-shadow: var(--shadow-sm); transition: transform .15s, box-shadow .15s;
    }
    .button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .button:hover { text-decoration: none; transform: translateY(-2px); box-shadow: var(--shadow-md); }

    .signal-board {
      align-self: stretch; display: grid; align-content: center; gap: 16px;
      min-width: 0; min-height: 240px; padding: 22px;
      border: 1px solid rgba(13, 122, 110, 0.15); border-radius: var(--radius);
      background: rgba(255,255,255,0.55);
    }
    @media (prefers-color-scheme: dark) {
      .signal-board { background: rgba(28, 35, 33, 0.6); }
    }

    .wave {
      width: 100%; min-width: 0; height: 110px;
      border-radius: 8px; border: 1px solid var(--line-light);
      background:
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px),
        linear-gradient(0deg, var(--bg-grid) 1px, transparent 1px),
        var(--surface);
      background-size: 20px 20px; overflow: hidden;
    }
    .wave svg { width: 100%; height: 100%; display: block; }

    .metrics {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .metric {
      min-width: 0; padding: 12px 14px;
      border: 1px solid var(--line-light); border-radius: 8px;
      background: var(--surface);
    }
    .metric strong { display: block; font-size: 26px; line-height: 1; color: var(--accent); }
    .metric span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; font-weight: 650; }

    .layout {
      display: grid; grid-template-columns: 210px minmax(0, 1fr);
      gap: 28px; width: min(1180px, calc(100% - 32px)); margin: 0 auto 56px; align-items: start;
    }

    .sidebar {
      position: sticky; top: 80px; padding: 14px;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow-sm);
    }
    .sidebar-title {
      margin: 0 0 10px; color: var(--muted); font-size: 11px; font-weight: 760;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .side-nav { display: grid; gap: 3px; }
    .side-nav a,
    .side-nav-toggle {
      display: block; width: 100%; padding: 7px 10px; border-radius: var(--radius-sm);
      border: 0; background: transparent; text-align: left; font-family: inherit;
      color: var(--muted); font-size: 14px; font-weight: 620;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .side-nav a:hover,
    .side-nav-toggle:hover { background: var(--surface-strong); color: var(--ink); text-decoration: none; }
    .side-nav a.is-active,
    .side-nav-toggle.is-active { background: var(--accent-soft); color: var(--accent-strong); }
    .side-nav-group { display: grid; gap: 3px; }
    .side-nav-toggle {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .side-nav-toggle svg {
      flex: 0 0 auto; width: 10px; height: 10px; transition: transform .15s;
    }
    .side-nav-group.is-open .side-nav-toggle svg { transform: rotate(180deg); }
    .side-nav-sub {
      display: none; gap: 2px; padding: 2px 0 4px 10px;
      margin-left: 10px; border-left: 1px solid var(--line);
    }
    .side-nav-group.is-open .side-nav-sub { display: grid; }
    .side-nav-sub a { padding: 6px 9px; font-size: 13px; font-weight: 620; }

    .content { display: grid; gap: 22px; min-width: 0; max-width: 100%; overflow: hidden; }
    #sections { display: grid; gap: 26px; }

    .toolbar {
      display: flex; align-items: center; gap: 12px; min-width: 0;
      padding: 14px 18px;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow-sm);
    }
    .search {
      width: 100%; min-height: 44px;
      border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 14px; color: var(--ink); background: var(--surface);
      font: inherit; font-size: 14px; transition: border-color .15s, box-shadow .15s;
    }
    .search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .count-pill {
      flex: 0 0 auto; padding: 8px 14px; border-radius: 8px;
      background: var(--accent-soft); color: var(--accent-strong);
      font-size: 13px; font-weight: 760; white-space: nowrap;
    }

    .section {
      scroll-margin-top: 86px; min-width: 0;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow-sm);
      overflow: hidden; transition: box-shadow .2s;
    }
    .section:hover { box-shadow: var(--shadow-md); }

    .section-header {
      display: flex; align-items: end; justify-content: space-between; gap: 16px;
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--line-light);
      border-left: 4px solid var(--accent);
      background:
        linear-gradient(90deg, var(--accent-soft), transparent 72%),
        linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--bg) 60%, var(--surface)));
    }

    h2 {
      margin: 0; font-size: clamp(20px, 2.8vw, 30px);
      line-height: 1.15; letter-spacing: 0; color: var(--accent-strong);
    }

    .section-count {
      flex: 0 0 auto; padding: 4px 12px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-strong);
      font-size: 12px; font-weight: 760; white-space: nowrap;
    }

    .table-wrap { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; }

    table { width: 100%; min-width: 720px; border-collapse: collapse; }

    th, td {
      padding: 12px 16px; text-align: left; vertical-align: middle;
      font-size: 14px; border-bottom: 1px solid var(--line-light);
    }
    th {
      position: sticky; top: 0; z-index: 1;
      background: var(--surface-strong); color: var(--muted);
      font-size: 11px; font-weight: 820; text-transform: uppercase; letter-spacing: 0.08em;
    }
    td:first-child { width: 60%; font-weight: 620; color: var(--ink-soft); }
    td:nth-child(2) { width: 20%; white-space: nowrap; color: var(--muted); }
    td:nth-child(3) { width: 20%; white-space: nowrap; }

    tbody tr { transition: background .12s; }
    tbody tr:not(.is-hidden):hover { background: var(--accent-soft); }
    tbody tr:last-child td { border-bottom: 0; }

    tr.is-hidden { display: none; }

    td:first-child a { color: var(--ink-soft); transition: color .15s; }
    td:first-child a:hover { color: var(--accent); }

    .subsection-heading {
      display: flex; align-items: center; gap: 10px;
      margin: 18px 0 0; padding: 16px 22px 10px;
      border-top: 1px solid color-mix(in srgb, var(--amber) 35%, var(--line));
      background: linear-gradient(90deg, color-mix(in srgb, var(--amber) 14%, transparent), transparent 74%);
      color: var(--amber);
      font-size: 16px; font-weight: 760; line-height: 1.3;
      letter-spacing: 0;
    }
    .section-header + .subsection-heading { margin-top: 0; }
    .subsection-heading::before {
      content: ""; width: 4px; height: 18px; border-radius: 999px;
      background: var(--amber); flex: 0 0 auto;
    }

    .empty-state {
      display: none; padding: 32px 24px; text-align: center;
      color: var(--muted); border-top: 1px solid var(--line-light); background: var(--surface);
      font-size: 14px;
    }
    .section.no-results .empty-state { display: block; }

    .ack { padding: 22px; }
    .ack ul { margin: 0; padding-left: 20px; }
    .ack li { margin-bottom: 4px; }

    .site-footer {
      width: min(1180px, calc(100% - 32px)); margin: 0 auto 36px;
      text-align: center;
    }
    .site-footer span {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 18px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--line-light);
      color: var(--muted-light); font-size: 12px; font-weight: 620;
      box-shadow: var(--shadow-sm);
    }
    .site-footer span::before {
      content: "";
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      opacity: 0.6;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .section { animation: fadeUp .4s ease both; }
    .section:nth-child(2) { animation-delay: .05s; }
    .section:nth-child(3) { animation-delay: .1s; }
    .section:nth-child(4) { animation-delay: .15s; }
    .section:nth-child(5) { animation-delay: .2s; }
    .section:nth-child(6) { animation-delay: .25s; }
    .section:nth-child(7) { animation-delay: .3s; }
    .section:nth-child(8) { animation-delay: .35s; }

    @media (max-width: 900px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .hero-grid { grid-template-columns: 1fr; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
    }

    @media (max-width: 620px) {
      .hero { width: min(1180px, calc(100% - 20px)); padding-top: 24px; }
      .hero-grid { padding: 22px; min-height: auto; }
      .metrics { grid-template-columns: 1fr; }
      .layout, .site-footer, .topbar { width: min(1180px, calc(100% - 20px)); }
      .signal-board { padding: 16px; }
      .wave { height: 90px; }
      .toolbar, .section-header { align-items: stretch; flex-direction: column; }
      .count-pill, .section-count { width: fit-content; }
      th, td { padding: 10px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#papers">Skip to content</a>
  <header class="site-header">
    <div class="topbar">
      <a class="brand" href="#">
        <span>Awesome rPPG</span>
      </a>
      <nav class="top-nav" aria-label="Primary">
        <a href="#survey">Survey</a>
        <a href="#traditional-methods">Traditional</a>
        <a href="#supervised-learning">Supervised</a>
        <a href="#self-supervised-learning">Self-Supervised</a>
        <a href="#dgdattta">DG/DA/TTA</a>
        <a href="#multimodal">Multimodal</a>
        <a href="#other">Other</a>
      </nav>
      <a class="Github-button" href="https://github.com/seven0813/Awesome-rPPG" target="_blank" rel="noopener noreferrer">Github</a>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-panel">
        <div class="hero-grid">
          <div>
            <p class="kicker" id="updated-label">Last updated: 2026-07-02</p>
            <h1 id="page-title">Awesome-rPPG</h1>
            <p class="intro" id="intro-text"></p>
            <div class="hero-actions">
              <a class="button primary" href="#papers">Browse Papers</a>
              <a class="button" href="README.md">README</a>
            </div>
          </div>
          <div class="signal-board" aria-label="rPPG signal summary">
            <div class="wave" aria-hidden="true">
              <svg viewBox="0 0 520 160" role="img">
                <path d="M0 96 L44 96 L60 58 L78 126 L102 96 L146 96 L164 42 L184 136 L208 96 L254 96 L270 64 L288 120 L314 96 L360 96 L378 50 L398 130 L422 96 L466 96 L482 70 L502 116 L520 96" fill="none" stroke="#c83f4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M0 97 L520 97" fill="none" stroke="#116c63" stroke-width="2" stroke-dasharray="8 10" opacity="0.45"/>
              </svg>
            </div>
            <div class="metrics">
              <div class="metric"><strong id="paper-count">0</strong><span>Papers</span></div>
              <div class="metric"><strong id="section-count">0</strong><span>Sections</span></div>
              <div class="metric"><strong id="code-count">0</strong><span>Code Links</span></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="layout">
      <aside class="sidebar">
        <p class="sidebar-title">Contents</p>
        <nav class="side-nav" id="side-nav" aria-label="Sections"></nav>
      </aside>

      <div class="content" id="papers">
        <div class="toolbar">
          <input class="search" id="search" type="search" placeholder="Search papers, venues, datasets..." aria-label="Search papers, venues, datasets">
          <span class="count-pill" id="visible-count">0 shown</span>
        </div>
        <div id="sections"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span>Built from README.md content.</span>
  </footer>

  <script>

    const slug = (text) => text.toLowerCase().trim().replace(/[^\w\s-]/g, "").replace(/\s+/g, "-");
    const escapeHtml = (text) => text
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    function inlineMarkdown(text) {
      let html = escapeHtml(text.trim());
      html = html.replace(/\[(.*?)\]\((.*?)\)/g, (_, label, href) => {
        const cleanLabel = label.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
        return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${cleanLabel}</a>`;
      });
      html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
      return html;
    }

    function splitTableRow(line) {
      let normalized = line.trim();
      if (!normalized.startsWith("|")) normalized = `|${normalized}`;
      if (!normalized.endsWith("|")) normalized = `${normalized}|`;
      return normalized.slice(1, -1).split("|").map((cell) => cell.trim());
    }

    function parseReadme(markdown) {
      const lines = markdown.split(/\r?\n/);
      const sections = [];
      let title = "";
      let updated = "";
      let intro = "";
      let acknowledgments = [];
      let current = null;
      let currentSub = null;

      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i];
        const trimmed = line.trim();

        if (trimmed.startsWith("# ")) {
          title = trimmed.replace(/^#\s+/, "");
          continue;
        }

        if (trimmed.startsWith("> Last updated:")) {
          updated = trimmed.replace(/^>\s*/, "");
          continue;
        }

        if (!intro && trimmed && !trimmed.startsWith("-") && !trimmed.startsWith("#") && !trimmed.startsWith("|")) {
          intro = trimmed;
          continue;
        }

        if (trimmed.startsWith("#### ")) {
          currentSub = {
            title: trimmed.replace(/^####\s+/, ""),
            headers: [],
            rows: []
          };
          if (current) {
            current.subs = current.subs || [];
            current.subs.push(currentSub);
          }
          continue;
        }

        if (trimmed.startsWith("### ")) {
          currentSub = null;
          current = {
            title: trimmed.replace(/^###\s+/, ""),
            headers: [],
            rows: [],
            subs: []
          };
          sections.push(current);
          continue;
        }

        if (trimmed === "## Acknowledgments") {
          current = null;
          while (i + 1 < lines.length) {
            i += 1;
            const ack = lines[i].trim();
            if (ack.startsWith("- ")) acknowledgments.push(ack.slice(2));
          }
          continue;
        }

        if (!current) continue;

        if (trimmed.includes("|") && !trimmed.startsWith("|:")) {
          const cells = splitTableRow(trimmed);
          if (cells.length >= 3 && cells.some(Boolean)) {
            const target = currentSub || current;
            if (/title/i.test(cells[0]) && /publication/i.test(cells[1])) {
              target.headers = cells.slice(0, 3);
            } else {
              target.rows.push(cells.slice(0, 3));
            }
          }
        }
      }

      return { title, updated, intro, sections, acknowledgments };
    }

    function renderTable(headers, rows, subId) {
      if (!rows.length) return "";
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${headers.map((header) => `<th>${escapeHtml(header)}</th>`).join("")}</tr>
            </thead>
            <tbody>${rows.map((row) => `
              <tr data-search="${escapeHtml(row.join(" ").toLowerCase())}">
                ${row.map((cell) => `<td>${inlineMarkdown(cell || "-")}</td>`).join("")}
              </tr>
            `).join("")}</tbody>
          </table>
        </div>
      `;
    }

    function renderSection(section) {
      const id = slug(section.title);
      const hasSubs = section.subs && section.subs.length > 0;
      const totalCount = section.rows.length + (hasSubs ? section.subs.reduce((s, sub) => s + sub.rows.length, 0) : 0);

      let body = "";
      if (!hasSubs) {
        body = renderTable(section.headers, section.rows, id);
      } else {
        body = renderTable(section.headers, section.rows, id);
        section.subs.forEach((sub) => {
          const subId = slug(sub.title);
          body += `<h3 class="subsection-heading" id="${subId}">${escapeHtml(sub.title)}</h3>`;
          body += renderTable(sub.headers, sub.rows, subId);
        });
      }

      return `
        <section class="section" id="${id}" data-section="${escapeHtml(section.title)}">
          <div class="section-header">
            <h2>${escapeHtml(section.title)}</h2>
            <span class="section-count">${totalCount} entries</span>
          </div>
          ${body}
          <div class="empty-state">No matching entries in this section.</div>
        </section>
      `;
    }

    function renderSideNav(sections, acknowledgments) {
      const sectionLinks = sections.map((section) => {
        const id = slug(section.title);
        const subs = section.subs || [];
        if (!subs.length) {
          return '<a href="#' + id + '">' + escapeHtml(section.title) + '</a>';
        }

        const subLinks = subs.map((sub) => {
          const subId = slug(sub.title);
          return '<a href="#' + subId + '" data-parent="#' + id + '">' + escapeHtml(sub.title) + '</a>';
        }).join("");

        return [
          '<div class="side-nav-group" data-group="#' + id + '">',
          '<button class="side-nav-toggle" type="button" data-target="#' + id + '" aria-expanded="false">',
          '<span>' + escapeHtml(section.title) + '</span>',
          '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
          '</button>',
          '<div class="side-nav-sub">' + subLinks + '</div>',
          '</div>'
        ].join("");
      }).join("");

      const ackLink = acknowledgments.length ? '<a href="#acknowledgments">Acknowledgments</a>' : "";
      return sectionLinks + ackLink;
    }

    function renderAcknowledgments(items) {
      if (!items.length) return "";
      return `
        <section class="section" id="acknowledgments">
          <div class="section-header">
            <h2>Acknowledgments</h2>
          </div>
          <div class="ack">
            <ul>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</ul>
          </div>
        </section>
      `;
    }

    async function loadReadme() {
      const response = await fetch("README.md", { cache: "no-cache" });
      if (!response.ok) {
        throw new Error("README.md request failed with status " + response.status);
      }
      return response.text();
    }

    function renderPage(source) {
      const data = parseReadme(source);
      const totalRows = data.sections.reduce((sum, section) => {
        const subRows = (section.subs || []).reduce((s, sub) => s + sub.rows.length, 0);
        return sum + section.rows.length + subRows;
      }, 0);
      const codeLinks = data.sections.reduce((sum, section) => {
        const mainLinks = section.rows.filter((row) => /github|download/i.test(row[2] || "")).length;
        const subLinks = (section.subs || []).reduce((s, sub) => s + sub.rows.filter((row) => /github|download/i.test(row[2] || "")).length, 0);
        return sum + mainLinks + subLinks;
      }, 0);

      document.title = data.title;
      document.getElementById("page-title").textContent = data.title;
      document.getElementById("updated-label").textContent = data.updated;
      document.getElementById("intro-text").textContent = data.intro;
      document.getElementById("paper-count").textContent = totalRows;
      document.getElementById("section-count").textContent = data.sections.length;
      document.getElementById("code-count").textContent = codeLinks;
      document.getElementById("visible-count").textContent = totalRows + " shown";
      document.getElementById("sections").innerHTML = data.sections.map(renderSection).join("") + renderAcknowledgments(data.acknowledgments);
      document.getElementById("side-nav").innerHTML = renderSideNav(data.sections, data.acknowledgments);
      setupNavInteractions();
      updateActiveNav();

      const search = document.getElementById("search");
      const visibleCount = document.getElementById("visible-count");

      search.addEventListener("input", () => {
        const query = search.value.trim().toLowerCase();
        let visible = 0;

        document.querySelectorAll(".section[data-section]").forEach((section) => {
          let sectionVisible = 0;
          section.querySelectorAll("tbody tr").forEach((row) => {
            const match = !query || row.dataset.search.includes(query);
            row.classList.toggle("is-hidden", !match);
            if (match) {
              visible += 1;
              sectionVisible += 1;
            }
          });
          section.classList.toggle("no-results", sectionVisible === 0);
        });

        visibleCount.textContent = visible + " shown";
      });
    }

    function updateActiveNav(hash = window.location.hash || "#survey") {
      const activeHash = hash || "#survey";

      document.querySelectorAll(".top-nav a, .side-nav a, .side-nav-toggle").forEach((item) => {
        item.classList.remove("is-active");
      });

      document.querySelectorAll('a[href="' + activeHash + '"]').forEach((link) => {
        link.classList.add("is-active");
      });

      const otherGroup = document.querySelector('.side-nav-group[data-group="#other"]');
      if (otherGroup && (activeHash === "#other" || otherGroup.querySelector('a[href="' + activeHash + '"]'))) {
        const otherTopLink = document.querySelector('.top-nav a[href="#other"]');
        if (otherTopLink) otherTopLink.classList.add("is-active");
      }

      document.querySelectorAll(".side-nav-group").forEach((group) => {
        const groupHash = group.dataset.group;
        const containsActiveSub = !!group.querySelector('a[href="' + activeHash + '"]');
        const isOpen = activeHash === groupHash || containsActiveSub;
        group.classList.toggle("is-open", isOpen);
        const toggle = group.querySelector(".side-nav-toggle");
        if (toggle) {
          toggle.setAttribute("aria-expanded", String(isOpen));
          toggle.classList.toggle("is-active", activeHash === groupHash || containsActiveSub);
        }
      });
    }

    function navigateToHash(hash) {
      const target = hash ? document.querySelector(hash) : null;
      if (hash) history.pushState(null, "", hash);
      if (target) target.scrollIntoView({ block: "start" });
      updateActiveNav(hash);
    }

    function setupNavInteractions() {
      document.querySelectorAll(".side-nav-toggle").forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const group = toggle.closest(".side-nav-group");
          const shouldOpen = !group.classList.contains("is-open");
          group.classList.toggle("is-open", shouldOpen);
          toggle.setAttribute("aria-expanded", String(shouldOpen));
          if (toggle.dataset.target) {
            navigateToHash(toggle.dataset.target);
          }
        });
      });

      document.querySelectorAll(".side-nav a").forEach((link) => {
        link.addEventListener("click", () => updateActiveNav(link.hash));
      });

      document.querySelectorAll(".top-nav a").forEach((link) => {
        link.addEventListener("click", () => updateActiveNav(link.hash));
      });

      window.addEventListener("hashchange", () => updateActiveNav());
    }

    function renderLoadError(error) {
      document.getElementById("updated-label").textContent = "README.md could not be loaded";
      document.getElementById("intro-text").textContent = "Open this page through GitHub Pages or a local web server so the browser can fetch README.md.";
      document.getElementById("sections").innerHTML = [
        '<section class="section">',
        '<div class="section-header"><h2>README.md load failed</h2></div>',
        '<div class="empty-state" style="display:block">' + escapeHtml(error.message) + '</div>',
        '</section>'
      ].join("");
    }

    loadReadme().then(renderPage).catch(renderLoadError);
  </script>
</body>
</html>
